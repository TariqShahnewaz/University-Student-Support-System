<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University Student Support System</title>
    
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav>
            <a href="index.html">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5fD-jxA0CnNo_c7isE8Ey9Qjaqj8C6SW6lN9SpJ1rLA&s" alt="University logo" width="48" height="48"" alt="University logo" width="48" height="48">
                <strong>University Student Support System</strong>
            </a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Login Form -->
        <div>
            <span aria-hidden="true"></span>

            <h1 id="login-title">Welcome Back</h1>
            <p>Log in to your account</p>

            <form action="#" method="post">
                <div>
                    <label for="username">Student ID or Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your Student ID or Email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    
                    <button type="button" aria-label="Show password"></button>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="remember" checked>
                        Remember me
                    </label>

                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit">Login</button>
            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </div>
    </main>

</body>
</html>
