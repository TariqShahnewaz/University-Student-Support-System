<!DOCTYPE html>
<html lang="en">

<head>
    <title>Report a Problem</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🏛️</div>
            <h2>University Student<br>Support System</h2>
        </div>
        <nav>
            <a class="menu-link" href="index.html">🏠 <span>Dashboard</span></a>
            <a class="menu-link active" href="report.html">➕ <span>Report a Problem</span></a>
            <a class="menu-link" href="profile.html">👤 <span>Profile</span></a>
        </nav>
        <button class="logout" onclick="showMessage('Logout button clicked')">↪️ Logout</button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>🏛️ <b>University Student Support System</b></div>
            <div>🔔 &nbsp; 👤 <b>MD. NIHAL ABRAR</b> ▾</div>
        </header>
        <div class="content">
            <div class="page-title"><span>➕</span>
                <div>
                    <h1>Report a Problem</h1>
                    <p>Help make our campus better. Share the problem, suggest a solution, and let your university know.
                    </p>
                </div>
            </div>
            <form id="reportForm" class="white-card report-form">
                <label>Title <b>*</b><input id="title" type="text"
                        placeholder="E.g. Water leakage in C building"></label>
                <div class="two-column"><label>Category <b>*</b><select id="category">
                            <option value="">Select a category</option>
                            <option>Infrastructure</option>
                            <option>Maintenance</option>
                            <option>Food & Dining</option>
                            <option>Academic</option>
                        </select></label><label>Location <b>*</b><select id="location">
                            <option value="">Select a location</option>
                            <option>A Building</option>
                            <option>B Building</option>
                            <option>C Building</option>
                            <option>D Building</option>
                            <option>Canteen</option>
                        </select></label></div>
                <label>Description <b>*</b><textarea id="description"
                        placeholder="Describe the problem in detail..."></textarea></label>
                <label>Suggested Solution <span>(Optional)</span><textarea id="solution"
                        placeholder="Any suggestions on how to fix this?"></textarea></label>
                <div class="form-buttons"><button type="button" class="cancel-button"
                        onclick="window.location.href='index.html'">Cancel</button><button type="submit"
                        class="submit-button">➤ Submit Report</button></div>
            </form>
        </div>
    </main>
    <div id="message" class="message"></div>
    <script src="script.js"></script>
</body>

</html>
